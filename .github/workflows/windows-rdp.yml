name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Restore Save Files from Repo
        continue-on-error: true
        run: |
          git clone https://${{ secrets.SAVE_REPO_TOKEN }}@github.com/alphamhouse772/artleses.git save-source
          if (Test-Path "save-source") {
            New-Item -ItemType Directory -Force -Path "C:\Users\${{ secrets.ADMIN_USERNAME }}\Desktop"
            Copy-Item -Path "save-source\*" -Destination "C:\Users\${{ secrets.ADMIN_USERNAME }}\Desktop\" -Recurse -Force
          }

      - name: Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: Create Admin Account
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          $Password = ConvertTo-SecureString "$Env:ADMIN_PASSWORD" -AsPlainText -Force
          New-LocalUser -Name "$Env:ADMIN_USERNAME" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "$Env:ADMIN_USERNAME" -ErrorAction SilentlyContinue
          net user runneradmin "$Env:ADMIN_PASSWORD"

      - name: Install & Connect Tailscale Funnel
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          TAILSCALE_HOSTNAME: ${{ secrets.TAILSCALE_HOSTNAME }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="$Env:TAILSCALE_HOSTNAME"
          Start-Sleep -Seconds 8
          & "C:\Program Files\Tailscale\tailscale.exe" funnel --bg 3389
          Start-Sleep -Seconds 5
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Connect to: $Env:TAILSCALE_HOSTNAME.<your-tailnet>.ts.net" -ForegroundColor Yellow
          Write-Host "  Username  : ${{ secrets.ADMIN_USERNAME }}" -ForegroundColor Yellow
          Write-Host "  Password  : (check your secret)" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green

      - name: Keep Server Alive (6 Hours)
        run: |
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/360] Server running..."
          }

      - name: Backup Save Files to Repo
        if: always()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git clone https://${{ secrets.SAVE_REPO_TOKEN }}@github.com/alphamhouse772/artleses.git save-destination
          New-Item -ItemType Directory -Force -Path "C:\Users\${{ secrets.ADMIN_USERNAME }}\Desktop"
          Copy-Item -Path "C:\Users\${{ secrets.ADMIN_USERNAME }}\Desktop\*" -Destination "save-destination\" -Recurse -Force
          cd save-destination
          git add .
          git commit -m "Update save files"
          git push

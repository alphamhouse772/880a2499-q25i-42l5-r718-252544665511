name: Windows Cloud RDP

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Restore Save Files from Repo
        continue-on-error: true
        shell: pwsh
        run: |
          git clone https://${{ secrets.SAVE_REPO_TOKEN }}@github.com/YourUsername/save-repo.git save-source
          if (Test-Path "save-source") {
            New-Item -ItemType Directory -Force -Path "C:\Users\NvDAdmin\Desktop"
            Copy-Item -Path "save-source\*" -Destination "C:\Users\NvDAdmin\Desktop\" -Recurse -Force
          }

      - name: Enable Remote Desktop & Firewall
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Create Admin Account
        shell: pwsh
        run: |
          $Password = ConvertTo-SecureString "${{ secrets.RDP_PASSWORD }}" -AsPlainText -Force
          New-LocalUser -Name "NvDAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NvDAdmin" -ErrorAction SilentlyContinue

      - name: Install & Connect Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        shell: pwsh
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="rdp-server"
          Start-Sleep -Seconds 8
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "RDP server setup completed. Connect using the Tailscale IP."
          Write-Host "Username: NvDAdmin"

      - name: Keep Server Alive (6 Hours)
        shell: pwsh
        run: |
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/360] Server running..."
          }

      - name: Backup Save Files to Repo
        if: always()
        continue-on-error: true
        env:
          SAVE_REPO_TOKEN: ${{ secrets.SAVE_REPO_TOKEN }}
        shell: pwsh
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git clone "https://x-access-token:$Env:SAVE_REPO_TOKEN@github.com/YourUsername/save-repo.git" save-destination
          if (Test-Path "save-destination") {
            New-Item -ItemType Directory -Force -Path "C:\Users\NvDAdmin\Desktop"
            Copy-Item -Path "C:\Users\NvDAdmin\Desktop\*" -Destination "save-destination\" -Recurse -Force
            Set-Location "save-destination"
            git add .
            git diff --cached --quiet
            if ($LASTEXITCODE -ne 0) {
              git commit -m "Update save files"
              git push
            }
          }
